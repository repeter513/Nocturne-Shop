admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
    - name: grpc_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 443
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: AUTO
                stat_prefix: grpc_gateway
                route_config:
                  name: shop_routes
                  virtual_hosts:
                    - name: catalog
                      domains: [ "catalog", "catalog.local" ]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: catalog, timeout: 30s }

                    - name: cart
                      domains: [ "cart", "cart.local" ]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: cart, timeout: 30s }
                    - name: auth
                      domains: [ "auth", "auth.local" ]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: auth, timeout: 30s }
                    - name: order
                      domains: [ "order", "order.local" ]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: order, timeout: 30s }
                    - name: payment
                      domains: [ "payment", "payment.local" ]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: payment, timeout: 30s }

                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: catalog
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: catalog
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: catalog, port_value: 8082 }

    - name: cart
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: cart
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: cart, port_value: 8083 }

    - name: auth
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: auth
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: auth, port_value: 8081 }

    - name: order
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: order
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: order, port_value: 8084 }

    - name: payment
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: payment
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: payment, port_value: 8086 }

