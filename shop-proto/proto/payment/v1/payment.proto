// Payment service — processes order payments with idempotency.
// Сервис платежей — обрабатывает оплату заказов с идемпотентностью.
syntax = "proto3";

import "google/protobuf/timestamp.proto";

package payment.v1;

option go_package = "github.com/repeter513/shop-proto/gen/go/payment/v1;paymentv1";

// PaymentService creates and queries payment records for orders.
// PaymentService создаёт и запрашивает записи платежей для заказов.
service PaymentService {
  // CreatePayment charges an order; amount/user taken from order service.
  // CreatePayment списывает оплату заказа; amount/user берутся из order-сервиса.
  rpc CreatePayment(CreatePaymentRequest) returns (CreatePaymentResponse);

  // GetPayment returns a single payment by ID.
  // GetPayment возвращает один платёж по ID.
  rpc GetPayment(GetPaymentRequest) returns (GetPaymentResponse);

  // ListPayments returns paginated payments, optionally filtered by order_id.
  // ListPayments возвращает постраничные платежи с опциональным фильтром order_id.
  rpc ListPayments(ListPaymentsRequest) returns (ListPaymentsResponse);
}

enum PaymentStatus {
  PAYMENT_STATUS_UNSPECIFIED = 0;
  PAYMENT_STATUS_PENDING = 1;
  PAYMENT_STATUS_SUCCESS = 2;
  PAYMENT_STATUS_FAILED = 3;
}

message Payment {
  int64 payment_id = 1;
  int64 order_id = 2;
  int64 user_id = 3;
  int64 amount = 4;       // Minor units / Минорные единицы
  PaymentStatus status = 5;
  google.protobuf.Timestamp created_at = 6;
}

message CreatePaymentRequest {
  int64 order_id = 1;
  // user_id, amount, simulate_failure removed — resolved server-side from order.
  // user_id, amount, simulate_failure удалены — определяются на сервере из заказа.
  reserved 2, 3, 4;
  reserved "user_id", "amount", "simulate_failure";
}

message CreatePaymentResponse {
  int64 payment_id = 1;
  PaymentStatus status = 2;
  string idempotency_key = 3;  // Echo for client deduplication / Echo для дедупликации на клиенте
}

message GetPaymentRequest {
  int64 payment_id = 1;
}

message GetPaymentResponse {
  Payment payment = 1;
}

message ListPaymentsRequest {
  reserved 1;
  reserved "user_id";    // From JWT / Из JWT
  int64 order_id = 2;    // 0 = all orders for user / 0 = все заказы пользователя
  int32 page = 3;
  int32 page_size = 4;
}

message ListPaymentsResponse {
  repeated Payment payments = 1;
  int32 total_count = 2;
}
